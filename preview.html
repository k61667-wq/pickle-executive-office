<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#9aa3af;font:12px system-ui;padding:16px;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
figure{margin:0;background:#fff;border-radius:12px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
figcaption{font:600 11px system-ui;color:#334155;padding:4px 2px 6px}
.crop{width:845px;height:957px;overflow:hidden;border-radius:8px}
.crop iframe{border:0;display:block;width:1280px;height:1450px;transform:scale(.66);transform-origin:top left}
.phone{border:0;display:block;border-radius:8px;background:#fff}
</style></head><body>
<figure><figcaption>Desktop 1280 (66%)</figcaption><div class="crop"><iframe src="index.html" scrolling="no"></iframe></div></figure>
<figure><figcaption>iPhone 390×844</figcaption><iframe class="phone" src="index.html" width="390" height="844"></iframe></figure>
</body></html>
